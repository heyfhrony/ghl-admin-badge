<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Add your GoHighLevel Certified Admin badge to your photo in seconds. Upload your photo, create your certified profile picture, and download it for free.">
  <title>GoHighLevel Certified Admin Badge Photo Creator</title>
  <meta property="og:title" content="GoHighLevel Certified Admin Badge Photo Creator">
  <meta property="og:description" content="Add your GoHighLevel Certified Admin badge to your photo in seconds. Upload your photo, create your certified profile picture, and download it for free.">
  <meta property="og:image" content="og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <style>
    :root {
      color-scheme: light;
      --ink: #222222;
      --muted: #71717a;
      --line: #e8ebef;
      --blue: #216bff;
      --blue-dark: #1555d6;
      --shadow: 0 18px 48px rgba(25, 38, 58, .075);
      --shadow-soft: 0 8px 24px rgba(25, 38, 58, .055);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-width: 320px; min-height: 100%; background: #fff; }
    body {
      min-width: 320px; min-height: 100vh; min-height: 100svh; margin: 0;
      background: #fff; color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid rgba(33, 107, 255, .25); outline-offset: 3px; }

    .page {
      width: min(1120px, calc(100% - 40px)); min-height: 100vh; min-height: 100svh;
      margin: 0 auto; display: flex;
    }
    .page-shell {
      width: 100%; min-height: inherit; padding: clamp(18px, 3vh, 28px) 0 18px;
      display: flex; flex-direction: column; align-items: center; gap: clamp(16px, 2.5vh, 24px);
    }
    .hero-heading { width: 100%; flex: 0 0 auto; margin-top: 20px; text-align: center; }
    h1 {
      margin: 0; color: var(--ink); font-size: clamp(28px, 2.8vw, 32px);
      line-height: 1.08; letter-spacing: -.045em; font-weight: 760;
    }
    h1 span { color: var(--ink); }
    .subtitle { max-width: 520px; margin: 8px auto 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .workspace {
      width: 100%; flex: 1 0 auto; min-height: 0; display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(380px, 1.08fr);
      gap: clamp(28px, 5vw, 64px); align-items: center;
    }
    .editor {
      width: 100%; max-width: 430px; justify-self: center; padding: 22px;
      border: 1px solid #edf0f4; border-radius: 22px; background: #fff; box-shadow: var(--shadow-soft);
    }
    .form-stack { display: grid; gap: 18px; }
    .field-title { margin-bottom: 8px; color: #343a46; font-size: 12px; font-weight: 700; letter-spacing: -.01em; }

    .upload-zone {
      width: 100%; min-height: 96px; padding: 13px 15px;
      display: flex; align-items: center; gap: 12px; text-align: left;
      border: 1px dashed #d4dce8; border-radius: 16px; background: #fbfcff;
      color: var(--ink); cursor: pointer;
      transition: border-color .2s ease, background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .upload-zone:hover, .upload-zone.is-dragover { border-color: var(--blue); background: #f7faff; box-shadow: 0 5px 18px rgba(33, 107, 255, .06); }
    .upload-zone.is-dragover { transform: scale(1.01); }
    .upload-icon {
      flex: 0 0 42px; width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 13px; color: var(--blue); background: #edf4ff;
    }
    .upload-copy { min-width: 0; flex: 1; display: grid; gap: 3px; }
    .upload-copy strong { overflow: hidden; color: #252b35; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .upload-copy span { color: #7a8492; font-size: 10px; }
    .browse-label { flex: 0 0 auto; color: var(--blue); font-size: 11px; font-weight: 700; }
    .file-feedback { margin: 3px 0 0; color: #58708e; font-size: 10px; line-height: 1.35; }
    .file-feedback:empty { display: none; }
    .file-feedback.error { color: #c44646; }
    .url-tools { margin-top: 6px; }
    .url-toggle {
      padding: 0; border: 0; background: none; color: var(--blue);
      font-size: 10px; font-weight: 700; cursor: pointer;
    }
    .url-toggle:hover { text-decoration: underline; }
    .url-entry { display: flex; gap: 7px; margin-top: 7px; }
    .url-entry input {
      width: 100%; min-width: 0; height: 38px; padding: 0 12px;
      border: 1px solid #e3e7ed; border-radius: 11px; outline: none;
      color: var(--ink); background: #fff; font: inherit; font-size: 10px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .url-entry input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(33, 107, 255, .09); }
    .url-add-button {
      min-width: 54px; padding: 0 12px; border: 0; border-radius: 11px;
      background: var(--blue); color: #fff; font-size: 10px; font-weight: 700; cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .url-add-button:hover:not(:disabled) { background: var(--blue-dark); transform: translateY(-1px); }
    .url-add-button:disabled { opacity: .6; cursor: wait; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .position-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .position-option {
      min-width: 0; min-height: 54px; padding: 8px 11px;
      display: flex; align-items: center; gap: 10px;
      border: 1px solid #e8ebef; border-radius: 14px; background: #fff;
      color: #535b67; cursor: pointer; text-align: left;
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    .position-option:hover { border-color: #c6d7f6; box-shadow: 0 4px 14px rgba(31, 53, 84, .05); }
    .position-option[aria-pressed="true"] {
      border-color: var(--blue); background: #f7faff;
      box-shadow: 0 0 0 2px rgba(33, 107, 255, .07); color: #202a3a;
    }
    .position-option > span:last-child { font-size: 11px; font-weight: 700; white-space: nowrap; }
    .mini-frame {
      position: relative; width: 31px; height: 38px; flex: 0 0 31px;
      overflow: hidden; border: 1px solid #e4eaf2; border-radius: 8px;
      background: linear-gradient(160deg, #f5f7fa, #e9eef5);
    }
    .mini-person {
      position: absolute; left: 50%; bottom: -5px; width: 22px; height: 23px;
      transform: translateX(-50%); border-radius: 12px 12px 4px 4px; background: #c5d5e8;
    }
    .mini-person::before {
      position: absolute; content: ""; width: 10px; height: 10px; left: 50%; top: -7px;
      transform: translateX(-50%); border-radius: 50%; background: #c5d5e8;
    }
    .mini-badge {
      position: absolute; z-index: 1; width: 9px; height: 9px;
      border: 1.5px solid #fff; border-radius: 50%; background: #16c4df;
      box-shadow: 0 1px 3px rgba(13, 35, 63, .2);
    }
    .mini-badge::after { content: ""; position: absolute; inset: 2px; border: 1px solid #132544; border-radius: 50%; background: #fff; }
    .corner-top-left .mini-badge { top: 3px; left: 3px; }
    .corner-top-right .mini-badge { top: 3px; right: 3px; }
    .corner-bottom-left .mini-badge { bottom: 3px; left: 3px; }
    .corner-bottom-right .mini-badge { bottom: 3px; right: 3px; }

    .download-button {
      width: 100%; min-height: 50px; padding: 0 17px;
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      border: 0; border-radius: 14px; background: var(--blue); color: #fff;
      font-size: 13px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 18px rgba(33, 107, 255, .18);
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .download-button:hover:not(:disabled) { background: var(--blue-dark); transform: translateY(-1px); box-shadow: 0 10px 22px rgba(33, 107, 255, .22); }
    .download-button:disabled { background: #bdc9dc; box-shadow: none; cursor: not-allowed; }

    .preview-card {
      --frame-size: min(420px, calc((100svh - 180px) * .8));
      width: min(100%, calc(var(--frame-size) + 34px)); margin-inline: auto; justify-self: center;
      padding: 16px; border: 1px solid #edf0f4; border-radius: 22px;
      background: #fff; box-shadow: var(--shadow);
    }
    .preview-frame {
      position: relative; width: min(100%, var(--frame-size));
      aspect-ratio: 4 / 5; margin: 0 auto; overflow: hidden;
      border: 1px solid #e9edf3; border-radius: 16px; background: #f7f9fc;
    }
    .photo-preview { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .badge-overlay {
      position: absolute; z-index: 2; width: 28%; height: auto;
      filter: drop-shadow(0 4px 6px rgba(12, 29, 52, .2));
      transition: top .2s ease, bottom .2s ease, left .2s ease, right .2s ease;
      pointer-events: none;
    }
    .badge-overlay.position-top-left { top: 4.5%; left: 4.5%; }
    .badge-overlay.position-top-right { top: 4.5%; right: 4.5%; }
    .badge-overlay.position-bottom-left { bottom: 4.5%; left: 4.5%; }
    .badge-overlay.position-bottom-right { bottom: 4.5%; right: 4.5%; }
    .empty-preview {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 42%, #fff 0%, #f8faff 70%, #f4f7fb 100%);
    }
    .page-footer {
      width: 100%; margin-top: auto; padding-top: 4px; flex: 0 0 auto;
      display: flex; justify-content: flex-end;
    }
    .page-footer a {
      color: var(--muted); font-size: 11px; line-height: 1.4;
      text-decoration: none; transition: color .18s ease;
    }
    .page-footer a:hover { color: var(--blue); text-decoration: underline; }
    .page-footer a:focus-visible {
      outline: 2px solid rgba(33, 107, 255, .35); outline-offset: 3px; border-radius: 2px;
    }

    @media (max-width: 760px) {
      .page { width: calc(100% - 32px); min-height: 100vh; min-height: 100svh; display: block; }
      .page-shell { min-height: inherit; padding: 10px 0 12px; gap: 12px; }
      .hero-heading h1 { font-size: clamp(20px, 5.5vw, 24px); line-height: 1.12; }
      .subtitle { max-width: 380px; margin-top: 5px; font-size: 11px; line-height: 1.35; }
      .workspace { flex: none; max-width: 500px; margin: 0 auto; grid-template-columns: 1fr; gap: 12px; }
      .editor { max-width: none; padding: 14px; border-radius: 18px; }
      .form-stack { gap: 12px; }
      .field-title { margin-bottom: 6px; font-size: 11px; }
      .upload-zone { min-height: 78px; padding: 10px 10px; gap: 9px; }
      .upload-icon { flex-basis: 36px; width: 36px; height: 36px; border-radius: 10px; }
      .upload-icon svg { width: 18px; height: 18px; }
      .upload-copy { gap: 2px; }
      .upload-copy strong { font-size: 11px; }
      .upload-copy span { font-size: 9px; }
      .browse-label { font-size: 10px; }
      .url-tools { margin-top: 4px; }
      .url-toggle { font-size: 9px; }
      .url-entry { gap: 6px; margin-top: 6px; }
      .url-entry input, .url-add-button { height: 34px; }
      .file-feedback { font-size: 9px; }
      .position-options { gap: 7px; }
      .position-option { min-height: 43px; padding: 5px 8px; gap: 7px; }
      .position-option > span:last-child { font-size: 10px; }
      .mini-frame { width: 26px; height: 32px; flex-basis: 26px; }
      .mini-person { width: 19px; height: 19px; }
      .mini-badge { width: 8px; height: 8px; }
      .corner-top-left .mini-badge { top: 2px; left: 2px; }
      .corner-top-right .mini-badge { top: 2px; right: 2px; }
      .corner-bottom-left .mini-badge { bottom: 2px; left: 2px; }
      .corner-bottom-right .mini-badge { bottom: 2px; right: 2px; }
      .download-button { min-height: 44px; font-size: 12px; }
      .preview-card {
        --frame-size: min(340px, max(210px, calc((100svh - 390px) * .8)));
        width: min(100%, calc(var(--frame-size) + 22px)); padding: 10px; border-radius: 18px;
      }
      .preview-frame { width: min(100%, var(--frame-size)); border-radius: 13px; }
    }
    @media (max-width: 370px) {
      .page { width: calc(100% - 24px); }
      .position-option { padding: 5px 6px; gap: 5px; }
      .position-option > span:last-child { font-size: 9px; }
    }
    @media (max-height: 700px) and (max-width: 760px) {
      .page-shell { padding-top: 6px; padding-bottom: 6px; gap: 8px; }
      .workspace { gap: 8px; }
      .editor { padding: 10px; }
      .hero-heading h1 { font-size: clamp(19px, 5.2vw, 22px); }
      .subtitle { margin-top: 4px; font-size: 10px; }
      .form-stack { gap: 8px; }
      .field-title { margin-bottom: 4px; }
      .upload-zone { min-height: 64px; }
      .position-option { min-height: 36px; }
      .mini-frame { width: 22px; height: 27px; flex-basis: 22px; }
      .mini-person { width: 17px; height: 16px; }
      .download-button { min-height: 40px; }
      .preview-card {
        --frame-size: min(320px, max(220px, calc((100svh - 390px) * .8)));
        width: min(100%, calc(var(--frame-size) + 18px)); padding: 8px;
      }
      .preview-frame { width: min(100%, var(--frame-size)); }
    }
    @media (max-height: 620px) and (min-width: 761px) {
      .page-shell { padding-top: 12px; padding-bottom: 10px; gap: 10px; }
      .workspace { gap: 28px; }
      .editor { padding: 14px; }
      .hero-heading h1 { font-size: clamp(32px, 4vw, 42px); }
      .subtitle { margin-top: 5px; font-size: 12px; }
      .form-stack { gap: 12px; }
      .upload-zone { min-height: 76px; }
      .position-option { min-height: 45px; }
      .download-button { min-height: 43px; }
      .preview-card {
        --frame-size: min(420px, calc((100svh - 168px) * .8));
        width: min(100%, calc(var(--frame-size) + 22px)); padding: 10px;
      }
      .preview-frame { width: min(100%, var(--frame-size)); }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-shell">
      <div class="hero-heading">
        <h1 id="page-title">Add GoHighLevel <span>Certified Admin Badge</span> to Your Photo</h1>
        <p class="subtitle">100% secure. Nothing stored. Everything happens in your browser.</p>
      </div>
      <div class="workspace">
        <section class="editor" aria-labelledby="page-title">
          <div class="form-stack">
          <section aria-labelledby="upload-label">
            <div class="field-title" id="upload-label">Photo</div>
            <button class="upload-zone" id="uploadButton" type="button" aria-describedby="uploadHelp fileFeedback">
              <span class="upload-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4.2A1.8 1.8 0 0 0 6.8 20h10.4a1.8 1.8 0 0 0 1.8-1.8V14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span class="upload-copy"><strong id="uploadTitle">Upload a photo</strong><span id="uploadSub">or drag it here</span><span id="uploadHelp">JPG, PNG, WEBP · 15 MB max</span></span>
              <span class="browse-label">Browse</span>
            </button>
            <input class="sr-only" id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Choose a profile photo">
            <div class="url-tools">
              <button class="url-toggle" id="toggleUrlButton" type="button" aria-expanded="false" aria-controls="urlEntry">Use image URL</button>
              <div class="url-entry" id="urlEntry" hidden>
                <input id="imageUrlInput" type="url" inputmode="url" autocomplete="url" placeholder="Paste a public image URL" aria-label="Image URL">
                <button class="url-add-button" id="loadUrlButton" type="button">Add</button>
              </div>
            </div>
            <p class="file-feedback" id="fileFeedback" role="status" aria-live="polite"></p>
          </section>

          <section aria-labelledby="position-label">
            <div class="field-title" id="position-label">Badge position</div>
            <div class="position-options" role="group" aria-label="Badge position">
              <button class="position-option" type="button" data-position="top-left" aria-pressed="false" aria-label="Top left">
                <span class="mini-frame corner-top-left" aria-hidden="true"><span class="mini-person"></span><span class="mini-badge"></span></span><span>Top left</span>
              </button>
              <button class="position-option" type="button" data-position="top-right" aria-pressed="true" aria-label="Top right">
                <span class="mini-frame corner-top-right" aria-hidden="true"><span class="mini-person"></span><span class="mini-badge"></span></span><span>Top right</span>
              </button>
              <button class="position-option" type="button" data-position="bottom-left" aria-pressed="false" aria-label="Bottom left">
                <span class="mini-frame corner-bottom-left" aria-hidden="true"><span class="mini-person"></span><span class="mini-badge"></span></span><span>Bottom left</span>
              </button>
              <button class="position-option" type="button" data-position="bottom-right" aria-pressed="false" aria-label="Bottom right">
                <span class="mini-frame corner-bottom-right" aria-hidden="true"><span class="mini-person"></span><span class="mini-badge"></span></span><span>Bottom right</span>
              </button>
            </div>
          </section>

          <button class="download-button" id="downloadButton" type="button" disabled>
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.5v8.3m0 0 3.2-3.2M10 11.8 6.8 8.6M4.5 13.4v2A1.6 1.6 0 0 0 6.1 17h7.8a1.6 1.6 0 0 0 1.6-1.6v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="downloadLabel">Download photo</span>
          </button>
        </div>
      </section>

      <aside class="preview-card" aria-label="Photo preview">
        <div class="preview-frame" id="previewFrame">
          <img class="photo-preview" id="photoPreview" alt="Photo preview with GoHighLevel Certified Admin badge" hidden>
          <div class="empty-preview" id="emptyPreview" aria-label="Photo preview placeholder">
            <svg width="38" height="38" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="5.5" y="7.5" width="29" height="25" rx="5" stroke="#9aabc0" stroke-width="1.6"/><circle cx="14.5" cy="15" r="2.8" stroke="#9aabc0" stroke-width="1.5"/><path d="m8.5 28 8.3-7.3a2.5 2.5 0 0 1 3.3.1l3.2 2.8 2.5-2.1a2.4 2.4 0 0 1 3.1.1l3.1 2.7" stroke="#9aabc0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <img class="badge-overlay position-top-right" id="badgePreview" alt="GoHighLevel Certified Admin badge" hidden>
        </div>
      </aside>
      </div>
      <footer class="page-footer">
        <a href="https://www.facebook.com/heyfhrony/" target="_blank" rel="noopener noreferrer">Built by Farhad</a>
      </footer>
    </div>
  </main>

    const photoInput = document.getElementById('photoInput');
    const uploadButton = document.getElementById('uploadButton');
    const uploadTitle = document.getElementById('uploadTitle');
    const uploadSub = document.getElementById('uploadSub');
    const fileFeedback = document.getElementById('fileFeedback');
    const toggleUrlButton = document.getElementById('toggleUrlButton');
    const urlEntry = document.getElementById('urlEntry');
    const imageUrlInput = document.getElementById('imageUrlInput');
    const loadUrlButton = document.getElementById('loadUrlButton');
    const photoPreview = document.getElementById('photoPreview');
    const badgePreview = document.getElementById('badgePreview');
    const emptyPreview = document.getElementById('emptyPreview');
    const downloadButton = document.getElementById('downloadButton');
    const downloadLabel = document.getElementById('downloadLabel');
    const positionButtons = [...document.querySelectorAll('.position-option')];
    const badgeForExport = new Image();
    let currentPhotoUrl = DEFAULT_PHOTO_SRC;
    let currentFileName = 'certified-admin-photo';
    let currentPosition = 'top-right';

    function updateDownloadState() {
      const photoReady = photoPreview.complete && photoPreview.naturalWidth > 0;
      const badgeReady = badgeForExport.complete && badgeForExport.naturalWidth > 0;
      downloadButton.disabled = !(currentPhotoUrl && photoReady && badgeReady);
    }
    photoPreview.addEventListener('load', updateDownloadState);
    photoPreview.addEventListener('error', updateDownloadState);
    badgeForExport.addEventListener('load', updateDownloadState);
    badgeForExport.addEventListener('error', updateDownloadState);

    badgePreview.src = BADGE_SRC;
    badgeForExport.src = BADGE_SRC;
    photoPreview.src = DEFAULT_PHOTO_SRC;
    photoPreview.hidden = false;
    emptyPreview.hidden = true;
    badgePreview.hidden = false;
    updateDownloadState();

    function setPosition(position) {
      currentPosition = position;
      positionButtons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.position === position));
      });
      badgePreview.classList.remove('position-top-left', 'position-top-right', 'position-bottom-left', 'position-bottom-right');
      badgePreview.classList.add(`position-${position}`);
    }

    function showError(message) {
      fileFeedback.textContent = message;
      fileFeedback.classList.add('error');
    }

    function loadPhoto(file) {
      fileFeedback.classList.remove('error');
      if (!file) return;
      const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
      if (!allowedTypes.includes(file.type)) {
        showError('Choose a JPG, PNG or WEBP image.');
        return;
      }
      if (file.size > MAX_PHOTO_BYTES) {
        showError('Photo must be under 15 MB.');
        return;
      }
      const nextUrl = URL.createObjectURL(file);
      const probe = new Image();
      probe.onload = () => {
        if (currentPhotoUrl && currentPhotoUrl.startsWith('blob:')) URL.revokeObjectURL(currentPhotoUrl);
        currentPhotoUrl = nextUrl;
        currentFileName = (file.name || 'certified-admin-photo').replace(/\.[^.]+$/, '').replace(/[^a-z0-9-_]+/gi, '-').replace(/^-+|-+$/g, '') || 'certified-admin-photo';
        downloadButton.disabled = true;
        photoPreview.src = nextUrl;
        photoPreview.hidden = false;
        emptyPreview.hidden = true;
        badgePreview.hidden = false;
        updateDownloadState();
        uploadTitle.textContent = file.name || 'Photo selected';
        uploadSub.textContent = 'Click or drop to replace';
        fileFeedback.textContent = '';
        fileFeedback.classList.remove('error');
      };
      probe.onerror = () => {
        URL.revokeObjectURL(nextUrl);
        showError('Could not open that photo.');
      };
      probe.src = nextUrl;
    }

    async function loadPhotoFromUrl() {
      const rawUrl = imageUrlInput.value.trim();
      if (!rawUrl) {
        showError('Paste an image URL.');
        return;
      }
      const candidate = /^(https?:|data:)/i.test(rawUrl) ? rawUrl : `https://${rawUrl}`;
      let parsedUrl;
      try {
        parsedUrl = new URL(candidate);
      } catch (error) {
        showError('Enter a valid image URL.');
        return;
      }
      if (!['http:', 'https:', 'data:'].includes(parsedUrl.protocol)) {
        showError('Enter a public image URL.');
        return;
      }

      loadUrlButton.disabled = true;
      fileFeedback.classList.remove('error');
      fileFeedback.textContent = 'Loading image…';
      try {
        const response = await fetch(parsedUrl.href, { mode: 'cors', credentials: 'omit' });
        if (!response.ok) throw new Error('Image URL returned an error');
        const contentLength = Number(response.headers.get('content-length'));
        if (Number.isFinite(contentLength) && contentLength > MAX_PHOTO_BYTES) {
          if (response.body) await response.body.cancel().catch(() => {});
          showError('Photo must be under 15 MB.');
          return;
        }
        let blob;
        if (response.body && typeof response.body.getReader === 'function') {
          const reader = response.body.getReader();
          const chunks = [];
          let totalBytes = 0;
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            totalBytes += value.byteLength;
            if (totalBytes > MAX_PHOTO_BYTES) {
              await reader.cancel().catch(() => {});
              showError('Photo must be under 15 MB.');
              return;
            }
            chunks.push(value);
          }
          blob = new Blob(chunks, { type: response.headers.get('content-type') || '' });
        } else {
          blob = await response.blob();
          if (blob.size > MAX_PHOTO_BYTES) {
            showError('Photo must be under 15 MB.');
            return;
          }
        }
        let mimeType = (blob.type || '').toLowerCase().split(';')[0];
        if (mimeType === 'image/jpg' || mimeType === 'image/pjpeg') mimeType = 'image/jpeg';
        const extension = parsedUrl.pathname.split('.').pop().toLowerCase();
        const extensionTypes = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' };
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(mimeType)) {
          mimeType = extensionTypes[extension] || mimeType;
        }
        const extensionByType = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };
        if (!extensionByType[mimeType]) {
          showError('URL must point to a JPG, PNG or WEBP image.');
          return;
        }
        const imageFile = new File([blob], `photo-from-url.${extensionByType[mimeType]}`, { type: mimeType });
        loadPhoto(imageFile);
        imageUrlInput.value = '';
        urlEntry.hidden = true;
        toggleUrlButton.setAttribute('aria-expanded', 'false');
      } catch (error) {
        showError('Could not access image. Use a public direct image URL that allows CORS.');
      } finally {
        loadUrlButton.disabled = false;
      }
    }

    toggleUrlButton.addEventListener('click', () => {
      urlEntry.hidden = !urlEntry.hidden;
      const isOpen = !urlEntry.hidden;
      toggleUrlButton.setAttribute('aria-expanded', String(isOpen));
      if (isOpen) imageUrlInput.focus();
    });
    loadUrlButton.addEventListener('click', loadPhotoFromUrl);
    imageUrlInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        loadPhotoFromUrl();
      }
    });

    uploadButton.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      loadPhoto(file);
      event.target.value = '';
    });
    uploadButton.addEventListener('dragover', (event) => {
      event.preventDefault();
      uploadButton.classList.add('is-dragover');
    });
    uploadButton.addEventListener('dragleave', (event) => {
      if (!uploadButton.contains(event.relatedTarget)) uploadButton.classList.remove('is-dragover');
    });
    uploadButton.addEventListener('drop', (event) => {
      event.preventDefault();
      uploadButton.classList.remove('is-dragover');
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      loadPhoto(file);
    });
    positionButtons.forEach((button) => {
      button.addEventListener('click', () => setPosition(button.dataset.position));
    });

    function drawCover(context, image, width, height) {
      const sourceRatio = image.naturalWidth / image.naturalHeight;
      const targetRatio = width / height;
      let sourceX = 0, sourceY = 0;
      let sourceWidth = image.naturalWidth, sourceHeight = image.naturalHeight;
      if (sourceRatio > targetRatio) {
        sourceWidth = image.naturalHeight * targetRatio;
        sourceX = (image.naturalWidth - sourceWidth) / 2;
      } else {
        sourceHeight = image.naturalWidth / targetRatio;
        sourceY = (image.naturalHeight - sourceHeight) / 2;
      }
      context.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, width, height);
    }

    downloadButton.addEventListener('click', () => {
      if (!currentPhotoUrl) return;
      if (!photoPreview.complete || !photoPreview.naturalWidth || !badgeForExport.complete || !badgeForExport.naturalWidth) {
        updateDownloadState();
        showError('Wait for the photo to finish loading, then try again.');
        return;
      }
      downloadButton.disabled = true;
      downloadLabel.textContent = 'Preparing…';
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 1500;
        const context = canvas.getContext('2d');
        drawCover(context, photoPreview, canvas.width, canvas.height);
        const badgeWidth = canvas.width * 0.28;
        const badgeHeight = badgeWidth * (badgeForExport.naturalHeight / badgeForExport.naturalWidth);
        const padding = canvas.width * 0.045;
        const badgeX = currentPosition.endsWith('left') ? padding : canvas.width - badgeWidth - padding;
        const badgeY = currentPosition.startsWith('top') ? padding : canvas.height - badgeHeight - padding;
        context.drawImage(badgeForExport, badgeX, badgeY, badgeWidth, badgeHeight);

        // Keep the export in the same user gesture so mobile browsers don't block it.
        const downloadDataUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = downloadDataUrl;
        link.download = `${currentFileName}-certified-admin.png`;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        link.remove();
        fileFeedback.textContent = '';
        fileFeedback.classList.remove('error');
      } catch (error) {
        showError('Could not prepare download. Try another photo.');
      } finally {
        updateDownloadState();
        downloadLabel.textContent = 'Download photo';
      }
